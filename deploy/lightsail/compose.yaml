name: admin-portfolio

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *runtime
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:?Set PUBLIC_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

  frontend:
    <<: *runtime
    image: "${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    mem_limit: 128m

  backend:
    <<: *runtime
    image: "${BACKEND_IMAGE:?Set BACKEND_IMAGE}"
    environment:
      SPRING_PROFILES_ACTIVE: local,docker,cloud
      PUBLIC_ORIGIN: "https://${PUBLIC_HOST:?Set PUBLIC_HOST}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET}"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    mem_limit: 768m

  mysql:
    <<: *runtime
    image: mysql:8.4
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=60", "--performance-schema=OFF"]
    environment:
      MYSQL_DATABASE: admin_portfolio
      MYSQL_USER: admin
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}"
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -uadmin admin_portfolio -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 640m

  redis:
    <<: *runtime
    image: redis:8.4
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m

  kafka-volume-init:
    image: apache/kafka:4.2.2
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"

  kafka:
    <<: *runtime
    image: apache/kafka:4.2.2
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID}"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "72"
      KAFKA_LOG_SEGMENT_BYTES: "104857600"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    mem_limit: 768m

  keycloak:
    <<: *runtime
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}"
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HOSTNAME: "https://${PUBLIC_HOST:?Set PUBLIC_HOST}/sso"
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: kc-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD}"
      PUBLIC_ORIGIN: "https://${PUBLIC_HOST:?Set PUBLIC_HOST}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET}"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    volumes:
      - ./portfolio-realm.json:/opt/keycloak/data/import/portfolio-realm.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 768m

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  caddy-data:
  caddy-config:
