apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: admin-portfolio
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/part-of: admin-portfolio
spec:
  # Docker Desktop exposes this Service on localhost for the local lab.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: admin-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
