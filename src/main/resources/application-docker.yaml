spring:
  datasource:
    url: jdbc:mysql://mysql:3306/admin_portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

  data:
    redis:
      host: redis

  kafka:
    bootstrap-servers: kafka:19092

  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/portfolio
            authorization-uri: http://localhost:8180/realms/portfolio/protocol/openid-connect/auth
            token-uri: http://keycloak:8080/realms/portfolio/protocol/openid-connect/token
            user-info-uri: http://keycloak:8080/realms/portfolio/protocol/openid-connect/userinfo
            jwk-set-uri: http://keycloak:8080/realms/portfolio/protocol/openid-connect/certs