spring:
  datasource:
    url: jdbc:mysql://localhost:3306/admin_portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: admin
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 운영 또는 공유 DB에서는 엔티티가 테이블을 바꾸면 안 됩니다.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  security:
    oauth2:
     client:
      registration:
        keycloak:
          provider: keycloak
          client-id: admin-api
          client-secret: ${KEYCLOAK_CLIENT_SECRET}
          client-authentication-method: client_secret_basic
          authorization-grant-type: authorization_code
          redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          scope:
            - openid
            - profile
            - email
          client-name: Keycloak
      provider:
        keycloak:
          issuer-uri: http://localhost:8180/realms/portfolio

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false

  session:
    timeout: 30m
    data:
      redis:
        namespace: admin-api:session	

  kafka:
    bootstrap-servers: localhost:9092
    producer:
     key-serializer: org.apache.kafka.common.serialization.StringSerializer
     value-serializer: com.portfolio.admin_api.config.KafkaMessageSerializer
     acks: all
     properties:
      "[enable.idempotence]": true
      "[spring.json.add.type.headers]": false


    consumer:
      group-id: order-log-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        "[spring.json.value.default.type]": com.portfolio.admin_api.order.application.event.OrderCreatedEvent
        "[spring.json.use.type.headers]": false  

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF

app:
  outbox:
   enabled: true
   fixed-delay-ms: 5000
   initial-delay-ms: 10000
   
   claim-duration-seconds: 120
   retry-delay-seconds: 30
   max-events-per-run: 100
   recovery-batch-size: 100   
