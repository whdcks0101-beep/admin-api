spring:
  application:
    name: admin-api
  profiles:
    default: local
  jpa:
    open-in-view: false

app:
  # Origin only, without a trailing slash. Override with APP_FRONTEND_ORIGIN in the cloud.
  frontend-origin: http://localhost:5173

management:
  endpoints:
   web:
    exposure:
      include: health

  endpoint:
   health:
    show-details: never
    show-components: never
    probes:
     enabled: true
